<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客户页 · 参考图蓝紫配色完整效果</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #eef0f3; color: #1f2329; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  .stage { min-height: 100vh; padding: 28px 18px 48px; }
  .note { width: min(390px, 100%); margin: 0 auto 14px; color: #646a73; font-size: 13px; line-height: 1.6; }
  .note strong { color: #1f2329; font-weight: 600; }
  .phone { width: min(390px, 100%); height: 820px; margin: 0 auto; overflow: hidden; position: relative; background: #f7f8fa; border: 1px solid #dfe3e8; border-radius: 20px; }
  .brand { background: #d1d0ef; }
  .status { height: 28px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 600; }
  .nav { height: 48px; display: flex; align-items: center; justify-content: center; position: relative; font-size: 17px; font-weight: 600; }
  .capsule { position: absolute; right: 10px; width: 78px; height: 30px; border: 1px solid rgba(31,35,41,.12); border-radius: 16px; display: flex; align-items: center; justify-content: space-around; padding: 0 9px; }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 3px; height: 3px; border-radius: 50%; background: #1f2329; }
  .capsule-line { width: 1px; height: 16px; background: rgba(31,35,41,.1); }
  .circle { width: 10px; height: 10px; border: 1.5px solid #1f2329; border-radius: 50%; position: relative; }
  .circle:after { content: ""; position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #1f2329; top: 2px; left: 2px; }
  .searchbar { height: 66px; padding: 8px 16px 14px; display: flex; gap: 8px; }
  .search, .filter { height: 38px; background: #fff; border-radius: 10px; display: flex; align-items: center; }
  .search { flex: 1; padding: 0 14px; gap: 10px; color: #8f959e; font-size: 14px; }
  .glass { width: 14px; height: 14px; border: 1.5px solid #a8aeb6; border-radius: 50%; position: relative; }
  .glass:after { content: ""; position: absolute; width: 6px; height: 1.5px; background: #a8aeb6; right: -5px; bottom: -2px; transform: rotate(45deg); border-radius: 2px; }
  .filter { padding: 0 13px; color: #4e535a; font-size: 13px; gap: 7px; }
  .chev { width: 6px; height: 6px; border-right: 1.5px solid #8f959e; border-bottom: 1.5px solid #8f959e; transform: rotate(45deg) translateY(-2px); }
  .content { height: calc(100% - 142px); padding: 2px 0 86px; overflow: hidden; }
  .group-head { display: flex; align-items: center; gap: 7px; padding: 16px 20px 8px; }
  .group-dot { width: 6px; height: 6px; border-radius: 50%; background: #f4dc84; }
  .group-dot.other { background: #2bb5a0; }
  .group-title { font-size: 12px; font-weight: 500; color: #646a73; letter-spacing: .5px; }
  .group-count { font-size: 11px; color: #b0b5bb; }
  .card { margin: 0 12px; background: #fff; border-radius: 12px; overflow: hidden; }
  .row { padding: 12px 16px; }
  .row + .row { border-top: 1px solid #f1f2f4; }
  .line1 { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .stale { width: 5px; height: 5px; flex: none; border-radius: 50%; background: #d97070; }
  .name { font-size: 15px; font-weight: 500; white-space: nowrap; }
  .tag { max-width: 90px; padding: 1px 7px; overflow: hidden; color: #6669a6; background: #f0f0fa; border-radius: 8px; font-size: 10px; font-weight: 500; line-height: 16px; text-overflow: ellipsis; white-space: nowrap; }
  .days { margin-left: auto; color: #a8aeb6; font-size: 12px; font-variant-numeric: tabular-nums; }
  .days.hot { color: #c45a5a; font-weight: 500; }
  .line2 { margin-top: 5px; display: flex; align-items: center; gap: 6px; color: #8f959e; font-size: 12px; font-variant-numeric: tabular-nums; }
  .sep { color: #dde1e6; }
  .fab { position: absolute; right: 17px; bottom: 74px; width: 52px; height: 52px; border-radius: 50%; background: #3370ff; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 29px; font-weight: 300; line-height: 1; }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 62px; background: #fff; border-top: 1px solid #e5e7eb; display: grid; grid-template-columns: repeat(4, 1fr); padding-top: 7px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #8f959e; font-size: 10px; }
  .tab.active { color: #3370ff; }
  .tab-icon { width: 18px; height: 18px; position: relative; }
  .people:before, .people:after { content: ""; position: absolute; border: 1.5px solid currentColor; }
  .people:before { width: 7px; height: 7px; border-radius: 50%; left: 5px; top: 0; }
  .people:after { width: 15px; height: 8px; border-radius: 8px 8px 3px 3px; left: 1px; bottom: 0; }
  .calendar { border: 1.5px solid currentColor; border-radius: 3px; }
  .calendar:before { content: ""; position: absolute; left: 2px; right: 2px; top: 5px; border-top: 1.5px solid currentColor; }
  .calendar:after { content: ""; position: absolute; width: 3px; height: 3px; border-radius: 50%; background: currentColor; left: 6px; top: 9px; box-shadow: 5px 0 0 currentColor; }
  .person:before { content: ""; position: absolute; width: 7px; height: 7px; border: 1.5px solid currentColor; border-radius: 50%; left: 5px; }
  .person:after { content: ""; position: absolute; width: 15px; height: 8px; border: 1.5px solid currentColor; border-radius: 8px 8px 3px 3px; left: 1px; bottom: 0; }
  .invite { border: 1.5px solid currentColor; border-radius: 50%; }
  .invite:before { content: ""; position: absolute; width: 7px; height: 1.5px; background: currentColor; left: 4px; top: 8px; }
  .invite:after { content: ""; position: absolute; width: 1.5px; height: 7px; background: currentColor; left: 7px; top: 5px; }
  .palette { width: min(390px, 100%); margin: 14px auto 0; padding: 12px 14px; background: #fff; border: 1px solid #e2e5e9; border-radius: 12px; color: #646a73; font-size: 12px; line-height: 1.7; }
  .palette b { color: #1f2329; }
  @media (max-width: 430px) { .stage { padding: 0; } .note, .palette { display: none; } .phone { width: 100%; height: 100dvh; border: 0; border-radius: 0; } }
</style>
</head>
<body>
<main class="stage">
  <div class="note"><strong>完整页面预览 · 参考图蓝紫配色</strong><br>只替换顶部与客户标签，其余沿用当前页面。</div>
  <section class="phone" aria-label="客户页完整效果预览">
    <header class="brand">
      <div class="status"><span>9:41</span><span>5G&nbsp;&nbsp;100%</span></div>
      <div class="nav">客户<div class="capsule"><span class="dots"><i></i><i></i><i></i></span><span class="capsule-line"></span><span class="circle"></span></div></div>
      <div class="searchbar"><div class="search"><span class="glass"></span><span>搜索客户昵称</span></div><div class="filter">筛选<span class="chev"></span></div></div>
    </header>
    <div class="content">
      <div class="group-head"><span class="group-dot"></span><span class="group-title">年卡会员</span><span class="group-count">3 人</span></div>
      <div class="card">
        <div class="row"><div class="line1"><span class="name">璐小娜</span><span class="tag">VIP 客户</span><span class="days">3 天</span></div><div class="line2"><span>到店 12 次</span><span class="sep">·</span><span>引流 耀凯</span><span class="sep">·</span><span>次卡余 8 次</span></div></div>
        <div class="row"><div class="line1"><span class="name">陈默</span><span class="tag">老带新</span><span class="days">15 天</span></div><div class="line2"><span>到店 8 次</span><span class="sep">·</span><span>引流 耀凯</span></div></div>
        <div class="row"><div class="line1"><span class="stale"></span><span class="name">林晓</span><span class="tag">重点跟进</span><span class="days hot">42 天</span></div><div class="line2"><span>到店 5 次</span><span class="sep">·</span><span>引流 婷婷</span><span class="sep">·</span><span>次卡余 2 次</span></div></div>
      </div>
      <div class="group-head"><span class="group-dot other"></span><span class="group-title">体验客户</span><span class="group-count">3 人</span></div>
      <div class="card">
        <div class="row"><div class="line1"><span class="name">方舟</span><span class="tag">新客</span><span class="days">未到店</span></div><div class="line2"><span>到店 0 次</span><span class="sep">·</span><span>引流 耀凯</span></div></div>
        <div class="row"><div class="line1"><span class="name">苏杭</span><span class="tag">活动咨询</span><span class="days">9 天</span></div><div class="line2"><span>到店 3 次</span><span class="sep">·</span><span>引流 婷婷</span></div></div>
        <div class="row"><div class="line1"><span class="stale"></span><span class="name">何青</span><span class="days hot">67 天</span></div><div class="line2"><span>到店 1 次</span><span class="sep">·</span><span>引流 耀凯</span></div></div>
      </div>
    </div>
    <div class="fab">+</div>
    <nav class="tabbar"><div class="tab active"><span class="tab-icon people"></span><span>客户</span></div><div class="tab"><span class="tab-icon invite"></span><span>邀约</span></div><div class="tab"><span class="tab-icon calendar"></span><span>课表</span></div><div class="tab"><span class="tab-icon person"></span><span>我的</span></div></nav>
  </section>
  <div class="palette"><b>本次唯一变化</b><br>顶部：#D1D0EF<br>客户标签：底色 #F0F0FA / 文字 #6669A6</div>
</main>
</body>
</html>
