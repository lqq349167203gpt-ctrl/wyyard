<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>「我的」页面 · 邀约风格 + PC 同款图标</title>
<style>
  :root {
    --ink: #1f2329;
    --ink-2: #646a73;
    --ink-3: #8f959e;
    --hairline: #f0f1f2;
    --page-bg: #f7f8fa;
    --primary: #3370ff;
    --head-blue: #f3f7ff;
    --sans: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--sans);
    background: #f2f3f5;
    color: var(--ink);
    padding: 40px 32px 80px;
    -webkit-font-smoothing: antialiased;
  }

  .doc-head { max-width: 520px; margin: 0 auto 28px; }
  .doc-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .doc-title span { color: var(--ink-3); font-weight: 400; }
  .doc-sub { font-size: 13px; color: var(--ink-2); margin-bottom: 16px; line-height: 1.7; }
  .principles { display: flex; flex-wrap: wrap; gap: 8px; }
  .principle {
    background: #fff; border: 1px solid var(--hairline);
    padding: 7px 12px; font-size: 12px; color: var(--ink-2); border-radius: 3px;
  }
  .principle b { color: var(--ink); font-weight: 600; }

  .frames { display: flex; justify-content: center; gap: 28px; align-items: flex-start; }
  .frame { flex: 0 0 375px; }
  .frame-tag { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .frame-no { font-size: 17px; font-weight: 700; color: var(--primary); }
  .frame-name { font-size: 15px; font-weight: 600; }
  .frame-desc { font-size: 12px; color: var(--ink-3); margin-left: auto; }

  .phone {
    width: 375px; height: 812px; background: var(--page-bg);
    border: 1px solid #dee2e6; overflow: hidden; position: relative;
    display: flex; flex-direction: column;
  }
  .statusbar {
    height: 24px; background: #fff; display: flex; align-items: center;
    justify-content: space-between; padding: 0 18px; font-size: 11px; font-weight: 600; flex-shrink: 0;
  }
  .navbar {
    height: 44px; background: #fff; display: flex; align-items: center; justify-content: center;
    position: relative; font-size: 16px; font-weight: 600; flex-shrink: 0;
  }

  /* 通栏浅蓝头：头像左对齐 + 名字 + 角色 pill */
  .head {
    background: var(--head-blue);
    padding: 22px 18px 26px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: #fff; color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 600; flex-shrink: 0;
  }
  .info { min-width: 0; flex: 1; }
  .name { font-size: 20px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .pill {
    display: inline-flex; align-items: center;
    margin-top: 7px; padding: 3px 12px;
    background: rgba(255, 255, 255, 0.78);
    border-radius: 999px;
    font-size: 11px; color: var(--primary); font-weight: 500;
  }

  /* 功能入口：白卡 + 图标 */
  .body { flex: 1; padding: 14px 12px 20px; overflow: hidden; }
  .menu {
    background: #fff; border-radius: 12px;
    padding: 0 16px; margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
  }
  .mi { display: flex; align-items: center; height: 50px; border-bottom: 1px solid var(--hairline); }
  .mi:last-child { border-bottom: none; }
  .ic { width: 20px; height: 20px; margin-right: 12px; flex-shrink: 0; }
  .tx { flex: 1; font-size: 15px; color: var(--ink); }
  .ar { font-size: 18px; color: #c0c4cc; flex-shrink: 0; }
  .logout {
    height: 52px; background: #fff; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: var(--ink);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
  }
</style>
</head>
