      <script>
        (function () {
          const lsTheme =
            localStorage && localStorage.getItem('appTheme');

          let nextTheme;

          if (lsTheme) {
            // 1. user
            nextTheme = lsTheme;

          } else if (window.__APP_PLATFORM__ === 'harmony') {
            // 2. hm
            nextTheme =
              window.__APP_SYS_THEME__ === 'dark'
                ? 'dark'
                : 'light';
          } else if (
            // 3. matchMedia
            window &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          ) {
            // 4. fallback
            nextTheme = 'dark';
          } else {
            nextTheme = 'light';
          }

          document.documentElement.classList.add(
            nextTheme === 'dark'
              ? 'skeleton-theme-dark'
              : 'skeleton-theme-light'
          );
        })();
      </script>
