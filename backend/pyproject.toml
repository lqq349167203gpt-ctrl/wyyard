[project]
name = "wyyard-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "langgraph>=0.4.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=1.0.0",
    "langchain-chroma>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "chromadb>=1.0.0",
    "lark-oapi>=1.5.0",
    "pypdf2>=3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "psycopg2-binary>=2.9.0",
    "PyJWT>=2.8.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "F401",   # 未使用的导入
    "F841",   # 未使用的局部变量
    "I001",   # 导入未排序
    "E",      # pycodestyle 错误
    "W",      # pycodestyle 警告
]
ignore = [
    "E501",   # 行长度（由 line-length 控制）
]
