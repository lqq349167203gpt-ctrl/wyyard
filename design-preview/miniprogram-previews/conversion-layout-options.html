<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>转化分析 · 三种布局方案</title>
<style>

;color:#9098a3}.tabs .active{color:#3370ff;position:relative}.tabs .active:after{content:"";position:absolute;bottom:0;height:2px;background:#3370ff;left:12px;right:12px}.scroll{overflow-y:auto;flex:1;scrollbar-width:none;padding:14px}.scroll::-webkit-scrollbar{display:none}.box{background:white;border:1px solid #edf0f3;border-radius:10px;padding:16px;margin-bottom:12px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}h3{font-size:15px;font-weight:500}.sub{color:#939ba7;font-size:11px}.muted{color:#87919e;font-size:12px}.row{display:flex;gap:10px;align-items:center;margin:10px 0}.row>label{color:#79828f;min-width:40px;font-size:12px}.field{margin:10px 0}.field>label{display:block;font-size:12px;color:#8a93a0;margin-bottom:6px}select,input,textarea{background:white;border:1px solid #e0e5eb;border-radius:6px;min-width:0;padding:8px 9px;max-width:100%;width:100%;font-size:13px}select{padding-right:20px}input[type=checkbox]{width:15px;height:15px;accent-color:#3370ff;padding:0}input[type=number]{width:64px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.periods{display:flex;gap:5px;flex:1}.periods button{flex:1;padding:6px 0;font-size:12px;background:#f7f8fa;border-color:transparent}.periods button.sel{background:#edf3ff;color:#3370ff}.chain{border-left:1px solid #e3e9f2;margin-left:10px;padding-left:19px}.stage{position:relative;padding-bottom:20px}.stage:last-child{padding-bottom:4px}.stage:before{content:"";position:absolute;left:-24px;top:5px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #7598ea}.stage-title{font-size:13px;font-weight:500;margin-bottom:8px}.badge{font-size:10px;color:#8b95a2;background:#f3f5f8;padding:2px 6px;border-radius:4px;margin-left:7px}.thin{height:1px;background:#eff1f5;margin:14px 0}.condition{padding:10px;background:#f7f9fc;border-radius:6px;margin-top:9px}.add{font-size:12px;color:#3370ff;border:0;padding:8px 0;background:none}.rule-summary{padding:12px;background:#f5f8ff;border-radius:7px;font-size:12px;color:#58719b;line-height:1.8}.footer{background:white;border-top:1px solid #e7ebf0;padding:12px 16px 18px;display:flex;gap:10px;align-items:center}.footer .primary{flex:1;height:39px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#eff2f5;border:1px solid #edf0f4;border-radius:8px;overflow:hidden;margin:14px 0}.stat{background:white;text-align:center;padding:13px 0;cursor:pointer}.stat span{font-size:11px;color:#8a95a1;display:block}.stat strong{display:block;font-size:24px;font-weight:500;margin:3px 0}.stat.active{background:#f0f5ff}.stat.active strong{color:#3370ff}.overview{display:flex;align-items:center;justify-content:space-between}.big{font-size:34px;font-weight:500;letter-spacing:-1px}.bar{height:5px;background:#edf0f4;border-radius:4px;overflow:hidden;margin:10px 0}.bar i{display:block;width:40%;background:#628de7;height:100%}.statuses{display:flex;gap:16px;overflow:auto;border-bottom:1px solid #eef0f3;margin-top:8px;white-space:nowrap}.statuses button{font-size:12px;padding:9px 0;border:0;border-radius:0;color:#8c95a0}.statuses button.sel{color:#3370ff;border-bottom:2px solid #3370ff}.person{padding:14px 0;border-bottom:1px solid #f0f2f5}.person:last-child{border:0}.person-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.person small{color:#969faa;font-size:11px}.person .state{font-size:11px;padding:2px 6px;border-radius:4px;background:#f0f5fd;color:#6581ae}.person .state.wait{background:#f6f4ed;color:#a29372}.person .state.no{background:#f3f4f6;color:#8c95a0}.entry{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e1e6ee;border-radius:8px;padding:13px;margin-bottom:12px;cursor:pointer}.entry strong{font-weight:500;font-size:13px}.entry p{font-size:11px;color:#8e99a8;margin-top:4px}.stepper{display:flex;justify-content:space-between;margin:3px 0 18px}.stepper button{border:0;background:none;padding:5px 0;color:#9ca4af;font-size:12px}.stepper button.sel{color:#3370ff}.stepper b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#edf0f4;margin-right:4px;font-weight:400}.stepper .sel b{background:#3370ff;color:white}.step-panel h2{font-size:21px;font-weight:500;margin-bottom:5px}.step-panel .box{margin-top:16px}.screen-dialog{position:absolute;inset:0;background:#1f293745;z-index:5;display:flex;align-items:flex-end}.screen-dialog[hidden]{display:none}.sheet{background:white;width:100%;max-height:86%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px}.sheet>.head button{border:0;padding:2px 5px;font-size:20px}.grab{height:4px;width:32px;border-radius:4px;background:#dde2e8;margin:-10px auto 17px}.toast{position:absolute;bottom:90px;left:30px;right:30px;text-align:center;padding:12px;background:#293545ee;color:white;border-radius:8px;font-size:12px;z-index:10}.note{font-size:11px;color:#9aa3af;text-align:center;margin:14px 0}.selected-note{font-size:11px;color:#7589a7;padding:9px 0}.single .gallery{display:block;max-width:450px}.single article{display:none}.single article.visible{display:block}.single .intro{max-width:650px;text-align:center}.single .nav{justify-content:center}@media(max-width:1000px){.gallery{gap:15px;padding:0 12px}.phone{height:780px}.scroll{padding:10px}.box{padding:12px}}@media(max-width:760px){.gallery{grid-template-columns:1fr;max-width:430px}.intro{margin-top:22px}h1{font-size:23px}.phone{height:790px}.caption{min-height:0}.gallery article{margin-bottom:15px}}
</style></head><body>
<header class="intro"><div class="eyebrow">WYYARD / MOBILE LAYOUT STUDY</div><h1>转化分析，先把层级理清楚。</h1><p>三种布局 · 同一套业务内容 · 使用虚构演示数据，不连接系统</p><nav class="nav"><a href="?view=all" data-view="all">三版对比</a><a href="?view=a" data-view="a">A · 分区直排</a><a href="?view=b" data-view="b">B · 结果优先</a><a href="?view=c" data-view="c">C · 分步配置</a></nav></header>
<main class="gallery" id="gallery"></main>
<script>
const $=(s,r=document)=>r.querySelector(s);
const opts=(items)=>items.map(x=>'<option>'+x+'</option>').join('');
const select=(items)=>'<select>'+opts(items)+'</select>';
const filter=()=>'<div class="field"><label>统计范围</label>'+select(['无忧小院','全部可见组织','疗愈俱乐部'])+'</div><div class="row"><label>周期</label><div class="periods"><button>当天</button><button>本周</button><button class="sel">本月</button><button>自定义</button></div></div><div class="two"><input type="date" value="2026-09-01" aria-label="开始日期"><input type="date" value="2026-09-13" aria-label="结束日期"></div>';
const rules=()=>'<div class="head"><h3>转化规则</h3><button class="link save">保存规则</button></div>'+select(['粗门到场 → 会员卡首购','自定义规则'])+'<p class="muted" style="margin-top:8px">看首次到场客户的会员卡购买情况</p>';
const source=()=>'<div class="field"><label>起始行为</label>'+select(['用粗门次卡参加活动','参与活动','购买产品或会员卡'])+'</div><div class="two">'+select(['全部活动类型','沙龙活动','觉醒游戏'])+select(['第一次参加','任意一次参加'])+'</div><div class="conditions"></div><button class="add condition-add">＋ 添加筛选条件</button>';
const target=()=>'<div class="field"><label>目标行为</label>'+select(['购买产品或会员卡','参与活动'])+'</div><div class="two">'+select(['会员卡','专项项目'])+select(['不限卡种','体验会员','45次卡'])+'</div><div class="field">'+select(['第一次购买','任意一次购买'])+'</div><div class="conditions"></div><button class="add condition-add">＋ 添加筛选条件</button>';
const boundaries=()=>'<div class="row"><label style="flex:1">转化间隔期限 <span title="0 表示当天；多项目之间的先后不限天数">ⓘ</span></label><input type="number" value="30" min="0" aria-label="转化间隔期限"><span class="muted">天</span></div><label class="row"><input type="checkbox" checked>仅统计同一组织 / 俱乐部</label><p class="sub">取消勾选后，统计所有有权查看的组织。</p>';
const editor=()=>rules()+'<div class="thin"></div><div class="chain"><div class="stage"><div class="stage-title">先选这类客户</div>'+source()+'</div><div class="stage"><div class="stage-title">再看是否达到</div>'+target()+'</div></div><div class="targets"></div><button class="add target-add">＋ 再加一项目标</button><div class="thin"></div>'+boundaries();
const sample=[['林小满','已转化','09/03 首次到场 → 09/08 购买会员卡'],['周知夏','观察中','09/10 首次到场 · 尚未购买会员卡'],['陈亦安','已转化','09/05 首次到场 → 09/09 购买会员卡'],['许一禾','未转化','08/01 首次到场 · 已超过 30 天期限']];
const results=()=>'<div class="box result-box"><div class="head"><h3>分析结果</h3><span class="sub">示例 · 09/01—09/13</span></div><div class="overview"><div><span class="muted">转化率</span><div class="big">40<span style="font-size:18px">%</span></div></div><div class="muted">起始客户 <span style="color:#2b2f36">60</span> 人<br>已转化 <span style="color:#2b2f36">24</span> 人</div></div><div class="bar"><i></i></div><div class="stats"><div class="stat" data-status="已转化"><span>已转化</span><strong>24</strong></div><div class="stat" data-status="未转化"><span>未转化</span><strong>16</strong></div><div class="stat" data-status="观察中"><span>观察中</span><strong>20</strong></div></div><div class="head" style="margin-top:22px;margin-bottom:0"><h3>客户明细</h3><button class="link export">导出</button></div><div class="statuses">'+['全部','已转化','未转化','观察中'].map((s,i)=>'<button data-status="'+s+'" class="'+(!i?'sel':'')+'">'+s+'</button>').join('')+'</div><div class="people">'+sample.map(([n,s,d])=>'<div class="person" data-state="'+s+'"><div class="person-head"><span>'+n+'</span><span class="state '+(s==='观察中'?'wait':s==='未转化'?'no':'')+'">'+s+'</span></div><small>'+d+'</small></div>').join('')+'</div><div class="note">当前仅展示 4 条虚构记录，供样式参考</div></div>';
const shell=(k,title,desc,body,foot)=>'<article id="'+k+'"><div class="caption"><h2><span class="letter">'+k.toUpperCase()+'</span>'+title+'</h2><p>'+desc+'</p></div><div class="phone"><div class="system"><span>9:41</span><span>▮▮▮　◔　▰</span></div><div class="top"><span>‹</span><span>组织数据</span><span class="capsule">••• ⊙</span></div><div class="tabs"><span>经营概况</span><span class="active">转化分析</span></div><div class="scroll">'+body+'</div><div class="footer">'+foot+'</div><div class="screen-dialog" hidden><div class="sheet"></div></div></div></article>';
$('#gallery').innerHTML=shell('a','分区直排','所有设置就地编辑；清晰分成范围、规则、结果。','<div class="box"><div class="head"><h3>统计范围</h3><span class="sub">01</span></div>'+filter()+'</div><div class="box">'+editor()+'</div>'+results(),'<button class="reset">重置</button><button class="primary query">查询结果</button>')
+shell('b','结果优先 · 推荐','常用规则收成摘要；需要调整时再打开编辑。','<div class="box">'+filter()+'</div><div class="entry edit-rule"><div><strong>粗门到场 → 会员卡首购</strong><p>首次参加 · 30 天内 · 同一组织</p></div><span style="color:#3370ff">调整 ›</span></div>'+results(),'<span class="muted" style="flex:1">当前规则 · 已保存</span><button class="primary query" style="flex:0 0 124px">重新查询</button>')
+shell('c','分步配置','一次只处理一类问题；适合初次配置复杂规则。','<div class="stepper">'+['选客户','定目标','看结果'].map((x,i)=>'<button data-step="'+i+'" class="'+(!i?'sel':'')+'"><b>'+(i+1)+'</b>'+x+'</button>').join('')+'</div><div class="step-panel" data-panel="0"><h2>想看哪些客户？</h2><p class="muted">先确定范围，再选择起始行为。</p><div class="box">'+rules()+'</div><div class="box">'+filter()+'</div><div class="box"><h3>起始客户</h3>'+source()+'</div></div><div class="step-panel" data-panel="1" hidden><h2>怎样才算转化？</h2><p class="muted">设置目标行为和允许的时间间隔。</p><div class="box">'+target()+'<div class="targets"></div><button class="add target-add">＋ 再加一项目标</button><div class="thin"></div>'+boundaries()+'</div></div><div class="step-panel" data-panel="2" hidden><div class="entry edit-step"><div><strong>粗门到场 → 会员卡首购</strong><p>30 天内 · 同一组织 · 点此返回调整</p></div><span>›</span></div>'+results()+'</div>','<button class="prev">上一步</button><button class="primary next">下一步 · 设置目标</button>');
const view=new URLSearchParams(location.search).get('view')||'all';document.body.classList.toggle('single',view!=='all');document.querySelectorAll('article').forEach(e=>e.classList.toggle('visible',e.id===view));document.querySelectorAll('.nav a').forEach(e=>e.classList.toggle('active',e.dataset.view===view));
function toast(root,msg){$('.toast',root)?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;$('.phone',root).append(t);setTimeout(()=>t.remove(),2000)}
function sheet(root,body){const mask=$('.screen-dialog',root);$('.sheet',mask).innerHTML='<div class="grab"></div><div class="head"><h3>规则设置</h3><button class="close" aria-label="关闭">×</button></div>'+body;mask.hidden=false}
let step=0;function go(n){step=Math.max(0,Math.min(2,n));const r=$('#c');r.querySelectorAll('[data-panel]').forEach(e=>e.hidden=+e.dataset.panel!==step);r.querySelectorAll('[data-step]').forEach(e=>e.classList.toggle('sel',+e.dataset.step===step));$('.prev',r).hidden=step===0;$('.next',r).textContent=['下一步 · 设置目标','查询并查看结果','重新查询'][step];$('.scroll',r).scrollTop=0}go(0);
document.addEventListener('click',e=>{const b=e.target.closest('button,.stat,.edit-rule,.edit-step');if(!b)return;const r=b.closest('article');if(!r)return;
if(b.closest('.periods')){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));toast(r,'已切换周期（演示）')}
if(b.matches('.edit-rule'))sheet(r,editor()+'<button class="primary apply" style="width:100%;margin-top:20px">应用并查询</button>');
if(b.matches('.close'))$('.screen-dialog',r).hidden=true;
if(b.matches('.apply')){$('.screen-dialog',r).hidden=true;toast(r,'已应用规则 · 展示演示结果')}
if(b.matches('.condition-add')){b.previousElementSibling.insertAdjacentHTML('beforeend','<div class="condition"><div class="two">'+select(['引流人','流量来源','会员身份'])+select(['等于','不等于'])+'</div><input style="margin-top:8px" placeholder="请选择或填写条件值"><button class="link remove" style="font-size:11px;margin-top:6px">移除条件</button></div>')}
if(b.matches('.target-add'))b.previousElementSibling.insertAdjacentHTML('beforeend','<div class="condition"><div class="head"><span>附加目标</span><button class="link remove">移除</button></div>'+target()+select(['满足全部目标','满足任一目标'])+'</div>');
if(b.matches('.remove'))b.closest('.condition').remove();
if(b.matches('.save'))sheet(r,'<div class="field"><label>规则名称</label><input value="粗门到场 → 会员卡首购"></div><div class="field"><label>规则简介</label><textarea rows="3">查看首次到场后的会员卡购买情况</textarea></div><div class="field"><label>可见范围</label>'+select(['仅自己','公共规则'])+'</div><button class="primary saved" style="width:100%">保存</button>');
if(b.matches('.saved')){$('.screen-dialog',r).hidden=true;toast(r,'规则已保存（仅演示，不写入系统）')}
if(b.matches('[data-status]')){const s=b.dataset.status;const box=b.closest('.result-box');box.querySelectorAll('.person').forEach(p=>p.hidden=s!=='全部'&&p.dataset.state!==s);box.querySelectorAll('[data-status]').forEach(t=>t.classList.toggle(t.matches('.stat')?'active':'sel',t.dataset.status===s))}
if(b.matches('.query')){$('.result-box',r).scrollIntoView({behavior:'smooth',block:'start'});toast(r,'查询完成 · 当前为虚构演示数据')}
if(b.matches('.export'))toast(r,'此处为导出入口示意');
if(b.matches('.reset')){r.querySelectorAll('select').forEach(s=>s.selectedIndex=0);toast(r,'已重置预览选项')}
if(b.matches('[data-step]'))go(+b.dataset.step);if(b.matches('.next')){if(step<2)go(step+1);else toast(r,'已更新演示结果')}if(b.matches('.prev'))go(step-1);if(b.matches('.edit-step'))go(0);
});
document.querySelectorAll('.screen-dialog').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.hidden=true}));
</script></body></html>
